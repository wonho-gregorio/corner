services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gym_management
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    ports:
      - "5432:5432"
    volumes:
      - gym-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gym_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym-postgres-data:

